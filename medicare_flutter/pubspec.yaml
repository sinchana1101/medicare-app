name: medicare_flutter
description: A new Flutter project for SmartMediCare.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  provider: ^6.1.2
  intl: ^0.20.1
  http: ^1.3.0
  google_fonts: ^6.2.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  android_alarm_manager_plus: ^5.1.2
  flutter_local_notifications: ^18.0.1
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
